<!DOCTYPE html>
<html lang="nl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excuusexpert — Nieuwsportal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* THEME VARIABLES */
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --surface: #111827;
      --surface-hover: #1f2937;
      --border: #374151;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #ef4444;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    :root[data-theme="light"] {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-hover: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #dc2626;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      transition: background 0.3s, color 0.3s;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* SVG ICON BASE STYLES */
    .icon {
      width: 18px;
      height: 18px;
      stroke-width: 2;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: inline-block;
      vertical-align: middle;
    }
    .icon-sm { width: 14px; height: 14px; }
    .icon-lg { width: 22px; height: 22px; }

    /* BREAKING NEWS TICKER */
    .breaking-banner {
      background: var(--accent);
      color: white;
      padding: 10px 20px;
      font-size: 0.875rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
      white-space: nowrap;
    }
    .breaking-tag {
      background: rgba(0,0,0,0.2);
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* NAVBAR */
    .navbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 14px 24px;
      backdrop-filter: blur(10px);
    }
    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .nav-btn {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      text-decoration: none;
    }
    .nav-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

    /* CONTAINER */
    .main-container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
      flex: 1;
      width: 100%;
    }

    /* SEARCH & CATEGORY TOOLBAR */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 30px;
      align-items: center;
      justify-content: space-between;
    }
    .search-box {
      position: relative;
      flex: 1;
      min-width: 280px;
    }
    .search-input {
      width: 100%;
      padding: 12px 16px 12px 45px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
    }
    .search-input:focus { border-color: var(--primary); }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      stroke: var(--text-muted);
    }
    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 5px;
    }
    .cat-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .cat-pill.active, .cat-pill:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* HOME VIEW GRID */
    .home-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 30px;
    }
    @media (max-width: 900px) {
      .home-grid { grid-template-columns: 1fr; }
    }

    /* HERO / HOOFDARTIKEL */
    .hero-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.2s;
      display: flex;
      flex-direction: column;
    }
    .hero-card:hover { transform: translateY(-3px); }
    .hero-img {
      width: 100%;
      height: 320px;
      object-fit: cover;
    }
    .hero-content {
      padding: 30px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .badge {
      display: inline-block;
      background: rgba(59, 130, 246, 0.15);
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 12px;
      width: fit-content;
    }
    .hero-title {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 12px;
      line-height: 1.25;
    }
    .meta-info {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
      align-items: center;
    }
    .meta-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .snippet {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 20px;
      flex: 1;
    }

    /* SIDEBAR / KLEINERE KAARTEN */
    .sidebar-feed {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .side-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: var(--shadow);
    }
    .side-card:hover { border-color: var(--primary); transform: translateX(4px); }
    .side-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    /* ARTICLE DETAIL VIEW */
    .reading-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 4px;
      background: var(--primary);
      width: 0%;
      z-index: 1000;
      transition: width 0.1s;
    }
    .article-view {
      max-width: 800px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      box-shadow: var(--shadow);
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 25px;
      transition: background 0.2s;
    }
    .back-btn:hover { background: var(--primary); color: white; }
    .article-header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 15px;
      line-height: 1.2;
    }
    .article-actions {
      display: flex;
      gap: 10px;
      margin: 20px 0 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .article-body {
      font-size: 1.1rem;
      line-height: 1.8;
      white-space: pre-line;
      color: var(--text);
    }
    .article-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin: 30px 0;
    }
    .article-gallery img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: transform 0.2s;
    }
    .article-gallery img:hover { transform: scale(1.02); }

    /* RELATED ARTICLES */
    .related-section {
      margin-top: 50px;
      padding-top: 30px;
      border-top: 1px solid var(--border);
    }
    .related-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 15px;
    }

    /* FOOTER */
    footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 60px;
    }
    .footer-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }

    /* LIGHTBOX */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .lightbox.active { display: flex; }
    .lightbox img { max-width: 90%; max-height: 90vh; border-radius: 8px; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="readingProgress" class="reading-progress"></div>

  <!-- BREAKING NEWS TICKER -->
  <div id="breakingBanner" class="breaking-banner hidden">
    <span class="breaking-tag">
      <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>
      Breaking
    </span>
    <span id="breakingText"></span>
  </div>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="#" class="brand" onclick="goHome(event)">
        <svg class="icon icon-lg" viewBox="0 0 24 24"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"></path><path d="M18 14h-8"></path><path d="M15 18h-5"></path><path d="M10 6h8v4h-8z"></path></svg>
        Excuusexpert Nieuws
      </a>
      <div class="nav-links">
        <button class="nav-btn" onclick="toggleFavoritesView()">
          <svg class="icon" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
          Favorieten (<span id="favCount">0</span>)
        </button>
        <button class="nav-btn" onclick="toggleTheme()">
          <svg class="icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          Thema
        </button>
      </div>
    </div>
  </nav>

  <!-- MAIN CONTAINER -->
  <div class="main-container" id="app"></div>

  <!-- LIGHTBOX -->
  <div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <img id="lightboxImg" src="">
  </div>

  <!-- FOOTER -->
  <footer>
    <div class="footer-content">
      <p>&copy; 2026 Excuusexpert Nieuws. Alle rechten voorbehouden.</p>
      <p></p>
    </div>
  </footer>

  <script>
    let articles = [];
    let currentView = 'home';
    let currentArticleId = null;
    let selectedCategory = 'Alles';
    let favorites = JSON.parse(localStorage.getItem('news_favorites')) || [];

    // THEME HANDLING
    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);

    // FETCH ARTICLES
    async function loadNews() {
      try {
        const res = await fetch('news.json?t=' + Date.now());
        if (!res.ok) throw new Error();
        articles = await res.json();
        
        articles.sort((a, b) => getTimestamp(b) - getTimestamp(a));
        
        render();
        updateBreakingNews();
      } catch (e) {
        document.getElementById('app').innerHTML = `<div style="text-align:center; padding: 50px;">Kan news.json niet laden of er zijn nog geen berichten.</div>`;
      }
    }

    function getTimestamp(article) {
      if (article.id && !isNaN(article.id) && Number(article.id) > 1000000000) return Number(article.id);
      return article.date ? new Date(article.date).getTime() : 0;
    }

    function updateBreakingNews() {
      if (articles.length > 0) {
        const banner = document.getElementById('breakingBanner');
        document.getElementById('breakingText').innerText = articles[0].title;
        banner.classList.remove('hidden');
      }
    }

    // ROUTING & RENDERING
    function render() {
      const app = document.getElementById('app');
      document.getElementById('favCount').innerText = favorites.length;

      if (currentView === 'home') {
        renderHome(app);
      } else if (currentView === 'article') {
        renderArticleDetail(app, currentArticleId);
      } else if (currentView === 'favorites') {
        renderFavorites(app);
      }
    }

    function goHome(e) {
      if (e) e.preventDefault();
      currentView = 'home';
      window.scrollTo(0, 0);
      render();
    }

    function openArticle(id) {
      currentArticleId = id;
      currentView = 'article';
      window.scrollTo(0, 0);
      render();
    }

    function toggleFavoritesView() {
      currentView = currentView === 'favorites' ? 'home' : 'favorites';
      window.scrollTo(0, 0);
      render();
    }

    // HOME VIEW RENDER
    function renderHome(container) {
      const searchQuery = document.getElementById('searchInputQuery')?.value.toLowerCase() || '';
      
      let filtered = articles.filter(art => {
        const matchesSearch = art.title.toLowerCase().includes(searchQuery) || art.content.toLowerCase().includes(searchQuery);
        const matchesCat = selectedCategory === 'Alles' || art.category === selectedCategory;
        return matchesSearch && matchesCat;
      });

      const categories = ['Alles', ...new Set(articles.map(a => a.category || 'Algemeen'))];

      container.innerHTML = `
        <div class="toolbar">
          <div class="search-box">
            <svg class="icon search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="searchInputQuery" class="search-input" placeholder="Zoek in alle nieuwsberichten..." value="${searchQuery}" oninput="renderHomeContent()">
          </div>
          <div class="categories">
            ${categories.map(cat => `<button class="cat-pill ${selectedCategory === cat ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}</button>`).join('')}
          </div>
        </div>

        <div id="homeFeed">
          ${filtered.length === 0 ? '<div style="text-align:center; padding:40px;">Geen nieuwsberichten gevonden.</div>' : generateHomeGrid(filtered)}
        </div>
      `;
    }

    function setCategory(cat) {
      selectedCategory = cat;
      render();
    }

    function renderHomeContent() {
      const searchQuery = document.getElementById('searchInputQuery').value.toLowerCase();
      let filtered = articles.filter(art => {
        const matchesSearch = art.title.toLowerCase().includes(searchQuery) || art.content.toLowerCase().includes(searchQuery);
        const matchesCat = selectedCategory === 'Alles' || art.category === selectedCategory;
        return matchesSearch && matchesCat;
      });
      document.getElementById('homeFeed').innerHTML = filtered.length === 0 ? '<div style="text-align:center; padding:40px;">Geen nieuwsberichten gevonden.</div>' : generateHomeGrid(filtered);
    }

    function generateHomeGrid(filtered) {
      const hero = filtered[0];
      const sideItems = filtered.slice(1);

      let html = `<div class="home-grid">`;
      
      if (hero) {
        const firstImg = hero.images && hero.images.length > 0 ? hero.images[0] : null;
        html += `
          <div>
            <article class="hero-card" onclick="openArticle('${hero.id}')">
              ${firstImg ? `<img src="${firstImg}" class="hero-img">` : ''}
              <div class="hero-content">
                <span class="badge">${hero.category || 'Laatste Nieuws'}</span>
                <h2 class="hero-title">${escapeHtml(hero.title)}</h2>
                <div class="meta-info">
                  <span class="meta-item">
                    <svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                    ${formatDate(getTimestamp(hero))}
                  </span>
                  <span class="meta-item">
                    <svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    ${Math.max(1, Math.ceil(hero.content.split(' ').length / 200))} min lezen
                  </span>
                </div>
                <p class="snippet">${escapeHtml(hero.content.substring(0, 160))}...</p>
              </div>
            </article>
          </div>
        `;
      }

      html += `<div class="sidebar-feed">`;
      sideItems.forEach(item => {
        html += `
          <div class="side-card" onclick="openArticle('${item.id}')">
            <span class="badge">${item.category || 'Nieuws'}</span>
            <h3 class="side-title">${escapeHtml(item.title)}</h3>
            <div class="meta-info" style="margin-bottom:0;">
              <span class="meta-item">
                <svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                ${formatDate(getTimestamp(item))}
              </span>
            </div>
          </div>
        `;
      });
      html += `</div></div>`;

      return html;
    }

    // ARTICLE DETAIL VIEW
    function renderArticleDetail(container, id) {
      const article = articles.find(a => a.id === id);
      if (!article) {
        container.innerHTML = `<p>Artikel niet gevonden.</p><button class="back-btn" onclick="goHome(event)">Terug naar overzicht</button>`;
        return;
      }

      const isFav = favorites.includes(id);
      const timestamp = getTimestamp(article);
      const related = articles.filter(a => a.id !== id).slice(0, 3);

      container.innerHTML = `
        <button class="back-btn" onclick="goHome(event)">
          <svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          Terug naar overzicht
        </button>
        <article class="article-view">
          <div class="article-header">
            <span class="badge">${article.category || 'Artikel'}</span>
            <h1>${escapeHtml(article.title)}</h1>
            <div class="meta-info">
              <span class="meta-item">
                <svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                ${formatDate(timestamp)}
              </span>
              <span class="meta-item">
                <svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                ${Math.max(1, Math.ceil(article.content.split(' ').length / 200))} min lezen
              </span>
            </div>
          </div>

          <div class="article-actions">
            <button class="nav-btn" onclick="toggleFavorite('${article.id}')">
              <svg class="icon" viewBox="0 0 24 24" style="fill: ${isFav ? 'currentColor' : 'none'};"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
              ${isFav ? 'Opgeslagen in favorieten' : 'Opslaan als favoriet'}
            </button>
            <button class="nav-btn" onclick="shareArticle('${escapeHtml(article.title)}')">
              <svg class="icon" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
              Deel link
            </button>
          </div>

          <div class="article-body">${escapeHtml(article.content)}</div>

          ${article.images && article.images.length > 0 ? `
            <div class="article-gallery">
              ${article.images.map(img => `<img src="${img}" onclick="openLightbox('${img}')">`).join('')}
            </div>
          ` : ''}

          <div class="related-section">
            <h3>Gerelateerde artikelen</h3>
            <div class="related-grid">
              ${related.map(r => `
                <div class="side-card" onclick="openArticle('${r.id}')">
                  <h4 style="font-size:1rem; font-weight:700; margin-bottom:6px;">${escapeHtml(r.title)}</h4>
                  <span style="font-size:0.8rem; color:var(--text-muted);">${formatDate(getTimestamp(r))}</span>
                </div>
              `).join('')}
            </div>
          </div>
        </article>
      `;

      window.onscroll = () => {
        const winScroll = document.documentElement.scrollTop;
        const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        const scrolled = (winScroll / height) * 100;
        document.getElementById('readingProgress').style.width = scrolled + '%';
      };
    }

    // FAVORITES VIEW
    function renderFavorites(container) {
      const favArticles = articles.filter(a => favorites.includes(a.id));
      container.innerHTML = `
        <button class="back-btn" onclick="goHome(event)">
          <svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          Terug naar overzicht
        </button>
        <h2 style="font-size:2rem; margin-bottom:20px;">Mijn Favoriete Artikelen</h2>
        <div class="sidebar-feed">
          ${favArticles.length === 0 ? '<p>Je hebt nog geen artikelen opgeslagen als favoriet.</p>' : favArticles.map(item => `
            <div class="side-card" onclick="openArticle('${item.id}')">
              <span class="badge">${item.category || 'Nieuws'}</span>
              <h3 class="side-title">${escapeHtml(item.title)}</h3>
              <div class="meta-info" style="margin-bottom:0;">
                <span class="meta-item">
                  <svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                  ${formatDate(getTimestamp(item))}
                </span>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function toggleFavorite(id) {
      if (favorites.includes(id)) {
        favorites = favorites.filter(f => f !== id);
      } else {
        favorites.push(id);
      }
      localStorage.setItem('news_favorites', JSON.stringify(favorites));
      renderArticleDetail(document.getElementById('app'), id);
      document.getElementById('favCount').innerText = favorites.length;
    }

    function shareArticle(title) {
      navigator.clipboard.writeText(window.location.href);
      alert(`Link naar "${title}" gekopieerd naar klembord!`);
    }

    // UTILITIES
    function formatDate(ts) {
      if (!ts) return '';
      return new Date(ts).toLocaleDateString('nl-NL', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function openLightbox(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightbox').classList.add('active');
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }

    document.addEventListener('DOMContentLoaded', loadNews);
  </script>
</body>
</html>
